name: Local contract checks

on:
  pull_request:
    branches: [main, task-05c-deploy-tool]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - run: node scripts/contracts/runtime-manifest.ts --check
      - run: npm run contracts:typecheck
      - run: npm run contracts:test
      - run: npm run deploy:test
      - run: npm run verify:test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run deploy:test:ui
      - run: npm run verify:test:ui
      - run: npm test
